<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leo Giorno – UGC creator</title>
<meta name="description" content="Leo Giorno – UGC creator and Social Media Specialist based in Milan.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&amp;family=Inter+Tight:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:#B4532A}
button{font:inherit;cursor:pointer}
video{display:block}
.w{max-width:1280px;margin:0 auto;padding-left:40px;padding-right:40px;box-sizing:border-box}
.sec{padding-top:104px;padding-bottom:104px}
.hd{font-family:'Shadows Into Light',cursive;line-height:1.15}
.logo{font-size:34px}.hm{font-size:24px}.hl{font-size:32px}.hxl{font-size:44px}
.h1{font-size:clamp(34px,6.5vw,92px);line-height:0.98;font-weight:500;letter-spacing:-0.04em}
.h2{font-size:56px;font-weight:500;letter-spacing:-0.03em;line-height:1}
.nav{display:flex;flex-wrap:wrap;gap:28px;font-size:14px;letter-spacing:0.06em;text-transform:uppercase}
.hero{position:relative;height:640px;border-radius:24px;overflow:hidden;background:#B5532C}
.hero-in{padding:40px}
.vd{display:block}.vm{display:none}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.strip{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 0}
.strip::-webkit-scrollbar{display:none}
.slide{flex:0 0 270px;margin:0}
.slide-s{flex:0 0 170px;margin:0}
.bleed{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding-left:max(40px,calc(50vw - 600px))}
.card-strip{margin-top:32px;margin-left:-48px;margin-right:-48px;padding-left:48px}
.cap{padding:40px 16px 14px}
.card{padding:44px 48px}
.card-t{font-size:40px}
.portrait{height:480px}
.about-t{font-size:30px}
.mail{font-size:clamp(22px,5.5vw,80px);overflow-wrap:anywhere}
.cta{white-space:nowrap}
#reels,#colours{scroll-margin-top:8px}
.collage{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:88px;gap:12px}
.ph{position:relative;margin:0;border-radius:14px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-cap{position:absolute;left:14px;bottom:10px;color:#FFF8EE;font-size:22px}
.note{display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;background:#F2C9A0;color:#7A3B2A;font-size:28px;line-height:1.15;border-radius:14px}
.p1{grid-column:1/8;grid-row:1/5}.p2{grid-column:8/11;grid-row:1/6}.p3{grid-column:11/13;grid-row:1/3}.p4{grid-column:11/13;grid-row:3/6}
.empty{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;box-sizing:border-box;background:#EFE3D3;border:2px dashed #CDB9A3;color:#7A5E4A;font-size:13px;line-height:1.3}
.p5{grid-column:1/4;grid-row:5/9}.p6{grid-column:4/8;grid-row:5/9}.p7{grid-column:8/13;grid-row:6/9}
.cc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cc{margin:0}
.cc-box{position:relative;border-radius:14px;overflow:hidden;background:#EFE3D3}
.cc-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cc-track::-webkit-scrollbar{display:none}
.cc-track img,.cc-track video{flex:0 0 100%;width:100%;aspect-ratio:4/5;object-fit:cover;display:block;scroll-snap-align:start}
.cc-btn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:999px;background:rgba(255,248,238,0.88);color:#221A15;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.cc-prev{left:10px}.cc-next{right:10px}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(23,19,15,0.7),rgba(23,19,15,0.3) 40%,rgba(23,19,15,0) 75%)}
.rt{font-size:22px}
.cc-cap{font-size:24px}
.meta-t{font-size:18px}
.dest-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:300px;gap:12px}
.dest{position:relative;border:0;border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;color:#FFF8EE;overflow:hidden}
.dest-wide{grid-column:span 2}
.dest-full{grid-column:1/-1}
.dest-big{grid-column:span 2;grid-row:span 2}
.dest-grid{grid-auto-flow:dense}
.dest-name,.dest-line{position:relative}
.ch-strip{display:flex;gap:10px;overflow-x:auto;height:360px;margin-top:16px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.ch-strip figure{height:100%;flex:0 0 auto}
.chapter{margin-top:32px;padding-top:24px;border-top:1px solid #E2D2BF}
.chapter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.chapter-grid-wide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.chapter-grid-5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:20px}
.chapter-flat>p{display:none}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.dest-name{font-size:42px;line-height:1;color:#F5C842}
.dest-line{font-size:14px;margin-top:6px}
.story{margin-top:20px;padding:32px;background:#FFFAF3;border:1px solid #E2D2BF;border-radius:20px;scroll-margin-top:20px}
.story-reels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}
.story-reels.three{grid-template-columns:repeat(3,minmax(0,1fr));max-width:860px}
.story-photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
@media (max-width:760px){
.w{padding-left:20px;padding-right:20px}
.sec{padding-top:64px;padding-bottom:64px}
.logo{font-size:30px}.hm{font-size:20px}.hl{font-size:26px}.hxl{font-size:32px}
.h2{font-size:38px}
.nav{gap:6px 16px;font-size:12px}
.hero{height:auto;aspect-ratio:9/16;border-radius:18px}
.hero-in{padding:22px}
.vd{display:none}.vm{display:block}
.filters{flex-wrap:nowrap;overflow-x:auto;margin-left:-20px;margin-right:-20px;padding:0 20px 6px}
.filters button{flex:0 0 auto}
.strip{gap:10px}
.slide{flex-basis:46vw}
.slide-s{flex-basis:34vw}
.bleed{padding-left:20px}
.card-strip{margin-left:-24px;margin-right:-24px;padding-left:24px;margin-top:24px}
.cap{padding:28px 10px 10px}
.card{padding:28px 24px}
.card-t{font-size:30px}
.portrait{height:380px}
.about-t{font-size:22px}
.cta{font-size:clamp(18px,6.6vw,32px)}
.collage{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:110px;gap:8px}
.ph-cap{left:10px;bottom:6px;font-size:18px}
.note{font-size:21px;padding:12px}
.p1{grid-column:1/3;grid-row:1/3}.p2{grid-column:1/2;grid-row:3/6}.p3{grid-column:2/3;grid-row:3/4}.p4{grid-column:2/3;grid-row:4/6}
.p5{grid-column:1/2;grid-row:6/8}.p6{grid-column:2/3;grid-row:6/8}.p7{grid-column:1/3;grid-row:8/10}
.cc-grid{grid-template-columns:minmax(0,1fr);gap:20px}
.dest-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:200px;gap:8px}
.dest{padding:14px}
.dest-name{font-size:22px}
.dest-line{font-size:11px;margin-top:4px}
.rt{font-size:16px}
.cc-cap{font-size:19px}
.meta-t{font-size:14px}
.story{padding:20px}
.story-reels{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.story-reels.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chapter-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ch-strip{height:260px;gap:8px}
.chapter-grid-wide{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chapter-grid-5{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid-2{grid-template-columns:minmax(0,1fr);gap:8px;margin-top:8px}
.grid-3{gap:6px;margin-top:8px}
.story-photos{grid-template-columns:minmax(0,1fr);gap:8px}
}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="background: #F6EFE6; color: #221A15; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 16px; line-height: 1.6; overflow-x: hidden">

<header class="w" style="padding-top: 20px; padding-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center">
<a href="#top" class="hd logo" style="color: #B4532A; text-decoration: none; line-height: 1">@leogiorno</a>
<nav aria-label="Main" class="nav">
<a href="#reels" style="text-decoration: none">Reels</a>
<a href="#colours" style="text-decoration: none">Vita lenta</a>
<a href="work.html" style="text-decoration: none">Brand work ↗</a>
<a href="#contact" style="text-decoration: none">Contact</a>
</nav>
</header>

<section id="about" class="w" style="padding-top: 24px; padding-bottom: 56px; display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center">
<figure style="margin: 0; flex: 1 1 420px; aspect-ratio: 16 / 9; background: #B88A66; border-radius: 20px; overflow: hidden"><video src="media/f0180b9f0d16ded3e6c46e634c81234f.mp4" poster="media/da37cea61c1ab86bc64b36ce564add50.jpg" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover"></video></figure>
<div style="flex: 1 1 300px">
<p class="hd hl" style="margin: 0; color: #B4532A">ciao, I’m leo</p>
<p class="about-t" style="margin: 8px 0 0; line-height: 1.3; font-weight: 500; letter-spacing: -0.01em">Based in Milan. I share what I see with my own eyes, and I help brands do the same.</p>
</div>
</section>

<section id="top" class="w" style="padding-top: 4px">
<div class="hero">
<sc-if value="{{ hasHeroD }}" hint-placeholder-val="{{ false }}">
<video class="vd" src="{{ heroD }}" autoplay="" muted="" loop="" playsinline="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></video>
</sc-if>
<sc-if value="{{ hasHeroM }}" hint-placeholder-val="{{ false }}">
<video class="vm" src="{{ heroM }}" autoplay="" muted="" loop="" playsinline="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></video>
</sc-if>
<div class="hero-in" style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; background: linear-gradient(to top, rgba(23, 19, 15, 0.6), rgba(23, 19, 15, 0) 60%)">
<span></span>
<div>
<p class="hd hxl" style="margin: 0 0 6px; color: #F5C842">chasing sunsets, slowly</p>
<h1 class="h1" style="margin: 0; max-width: 880px; color: #FFF8EE">UGC creator for places worth slowing down for.</h1>
</div>
</div>
</div>
</section>

<section id="reels" class="w sec">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 28px">
<div>
<p class="hd hl" style="margin: 0; color: #B4532A">daily moments</p>
<h2 class="h2" style="margin: 0">What I love to film</h2>
</div>
<div role="group" aria-label="Filter reels" class="filters">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
<button type="button" class="hd hm" onClick="{{ f.pick }}" aria-pressed="{{ f.pressed }}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; line-height: 1; white-space: nowrap; {{ f.st }}">{{ f.label }}</button>
</sc-for>
</div>
</div>
<div class="strip bleed" data-strip="reels" onTouchStart="{{ hold }}" onTouchMove="{{ hold }}" onTouchEnd="{{ hold }}" onPointerDown="{{ hold }}" onWheel="{{ hold }}" aria-label="Reels, scrolling automatically">
<sc-for list="{{ loop }}" as="r" hint-placeholder-count="8">
<figure class="slide" style="position: relative; border-radius: 14px; overflow: hidden">
<div style="aspect-ratio: 9 / 16; background: {{ r.color }}">
<sc-if value="{{ r.hasVideo }}" hint-placeholder-val="{{ false }}">
<video src="{{ r.src }}" poster="{{ r.poster }}" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover"></video>
</sc-if>
</div>
<span class="shade" aria-hidden="true"></span>
<figcaption class="cap" style="position: absolute; left: 0; right: 0; bottom: 0; color: #FFF8EE">
<span class="hd rt" style="display: block; line-height: 1.1; color: #F5C842">{{ r.title }}</span>
<span style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase">{{ r.catLabel }}</span>
</figcaption>
</figure>
</sc-for>
</div>
</section>

<section id="stills" class="w" style="padding-bottom: 104px">
<div style="margin-bottom: 28px">
<p class="hd hl" style="margin: 0; color: #B4532A">something about color orange</p>
<h2 class="h2" style="margin: 0">What I love to capture</h2>
</div>
<div class="collage">
<figure class="ph p1" style="background: #E08A4F"><video src="media/e1ad68aa8f38d0316a0ecf23ef6fc269.mp4" poster="media/5b0001e1b7b03bc1b32822c5d1976163.jpg" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover; display: block"></video></figure>
<figure class="ph p2" style="background: #8C4A2F"><video src="media/ccabe9e15f82956d58116b110eae2652.mp4" poster="media/499cfea66297b31a2dfbbbf5aea2f351.jpg" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover; display: block"></video></figure>
<figure class="ph p3" style="background: #B85A34"><video src="media/38fafed5a5d4e0abc4d3d70fa7bd2c37.mp4" poster="media/4dea703671f2e222d035b5068fb3b459.jpg" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover; object-position: 45% 70%; display: block"></video></figure>
<figure class="ph p4" style="background: #D9A27E"><video src="media/08de9cc57f628428c872889c8695667c.mp4" poster="media/b83e79820e53007df9d228c8d74e60f9.jpg" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover; display: block"></video></figure>
<figure class="ph p5" style="background: #3A302A"><video src="media/a3cc64d6a5e2e5a1546dfd78f68b9df5.mp4" poster="media/9b54121defe1da530eccb10befb51364.jpg" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover; display: block"></video></figure>
<figure class="ph p6" style="background: #C9693E"><video src="media/95dc5e1e45cb8f9c9baf2e9832e64173.mp4" poster="media/ed532814bcd9d5f029d621e28c510f61.jpg" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover; display: block"></video></figure>
<figure class="ph p7" style="background: #D9A27E"><video src="media/40c8a9ef09fc2129cae6acfaa7a6df83.mp4" poster="media/5ac28025419281aaf07aa3561dae2d30.jpg" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover; display: block"></video></figure>
</div>
</section>

<section id="colours" class="w" style="padding-bottom: 104px">
<div style="margin-bottom: 28px">
<p class="hd hl" style="margin: 0; color: #B4532A">collecting colours</p>
<h2 class="h2" style="margin: 0">Stories in frames</h2>
</div>
<div class="cc-grid">
<sc-for list="{{ carousels }}" as="k" hint-placeholder-count="3">
<figure class="cc">
<div class="cc-box">
<div class="cc-track" data-cc="{{ k.id }}">
<sc-for list="{{ k.slides }}" as="s" hint-placeholder-count="3">
<sc-if value="{{ s.isImg }}" hint-placeholder-val="{{ true }}">
<img src="{{ s.src }}" alt="" loading="lazy">
</sc-if>
<sc-if value="{{ s.isVid }}" hint-placeholder-val="{{ false }}">
<video src="{{ s.src }}" poster="{{ s.poster }}" autoplay="" muted="" loop="" playsinline="" preload="metadata"></video>
</sc-if>
</sc-for>
</div>
<button type="button" class="cc-btn cc-prev" onClick="{{ k.prev }}" aria-label="Previous photo">‹</button>
<button type="button" class="cc-btn cc-next" onClick="{{ k.next }}" aria-label="Next photo">›</button>
</div>
<figcaption class="hd cc-cap" style="margin-top: 8px; color: #221A15">{{ k.title }}</figcaption>
</figure>
</sc-for>
</div>
</section>

<section id="destinations" class="w" style="padding-bottom: 104px">
<div style="margin-bottom: 28px">
<p class="hd hl" style="margin: 0; color: #B4532A">vita lenta</p>
<h2 class="h2" style="margin: 0">Some places, but slowly</h2>

</div>
<div class="dest-grid">
<sc-for list="{{ dests }}" as="d" hint-placeholder-count="7">
<button type="button" class="{{ d.cls }}" onClick="{{ d.pick }}" aria-expanded="{{ d.open }}" style="background: linear-gradient(to top, rgba(23, 19, 15, 0.5), rgba(23, 19, 15, 0) 60%), {{ d.color }}; {{ d.ring }}">
<sc-if value="{{ d.hasCover }}" hint-placeholder-val="{{ false }}">
<sc-if value="{{ d.hasVid }}" hint-placeholder-val="{{ false }}">
<video src="{{ d.coverVid }}" poster="{{ d.coverPoster }}" autoplay="" muted="" loop="" playsinline="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></video>
</sc-if>
<sc-if value="{{ d.noVid }}" hint-placeholder-val="{{ false }}">
<img src="{{ d.cover }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
</sc-if>
<span class="shade" aria-hidden="true"></span>
</sc-if>
<span class="hd dest-name">{{ d.name }}</span>
<span class="dest-line">{{ d.line }}</span>
</button>
</sc-for>
</div>
<sc-if value="{{ hasDest }}" hint-placeholder-val="{{ false }}">
<div id="dest-story" class="story">
<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-start">
<div style="flex: 1 1 260px">
<p class="hd hxl" style="margin: 0; color: #B4532A">{{ cur.name }}</p>
<p style="margin: 4px 0 0; color: #5A4C42; font-size: 16px; max-width: 560px">{{ cur.text }}</p>
</div>
<button type="button" onClick="{{ closeDest }}" style="min-height: 44px; padding: 0 18px; background: transparent; border: 1px solid #CDB9A3; border-radius: 999px; color: #221A15; font-size: 14px">Close ×</button>
</div>
<sc-if value="{{ hasLead }}" hint-placeholder-val="{{ false }}">
<figure style="margin: 24px 0 0; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #B85A34">
<video src="{{ lead.src }}" poster="{{ lead.poster }}" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover"></video>
</figure>
</sc-if>
<div class="{{ reelsCls }}">
<sc-for list="{{ storyReels }}" as="s" hint-placeholder-count="4">
<figure style="margin: 0; aspect-ratio: 9 / 16; border-radius: 12px; overflow: hidden; background: {{ s.color }}">
<sc-if value="{{ s.hasVideo }}" hint-placeholder-val="{{ false }}">
<video src="{{ s.src }}" poster="{{ s.poster }}" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover"></video>
</sc-if>
</figure>
</sc-for>
</div>
<div class="story-photos">
<sc-for list="{{ storyPhotos }}" as="s" hint-placeholder-count="2">
<figure style="margin: 0; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: {{ s.color }}">
<sc-if value="{{ s.hasVideo }}" hint-placeholder-val="{{ false }}">
<video src="{{ s.src }}" poster="{{ s.poster }}" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover"></video>
</sc-if>
</figure>
</sc-for>
</div>
<sc-for list="{{ chapters }}" as="ch" hint-placeholder-count="1">
<div class="{{ ch.cls }}">
<p class="hd hl" style="margin: 0; color: #B4532A">{{ ch.title }}</p>
<p style="margin: 4px 0 0; color: #5A4C42; font-size: 16px; max-width: 560px">{{ ch.text }}</p>
<div class="{{ ch.grid }}">
<sc-for list="{{ ch.items }}" as="c" hint-placeholder-count="6">
<figure style="margin: 0; aspect-ratio: {{ c.ratio }}; border-radius: 12px; overflow: hidden; background: #C4562E">
<sc-if value="{{ c.isVideo }}" hint-placeholder-val="{{ false }}">
<video src="{{ c.src }}" poster="{{ c.poster }}" autoplay="" muted="" loop="" playsinline="" style="width: 100%; height: 100%; object-fit: cover"></video>
</sc-if>
<sc-if value="{{ c.isImg }}" hint-placeholder-val="{{ false }}">
<img src="{{ c.src }}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
</sc-if>
</figure>
</sc-for>
</div>
</div>
</sc-for>
</div>
</sc-if>
</section>

<section aria-label="What I create" style="background: #EFE3D3">
<div class="w sec">
<p class="hd hl" style="margin: 0; color: #B4532A">for brands and places</p>
