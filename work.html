<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leo Giorno – Brand & social work</title>
<meta name="description" content="Leo Giorno – UGC creator and Social Media Specialist based in Milan.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&amp;family=Inter+Tight:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#17130F}
a{color:inherit}a:hover{color:#F5C842}
button{font:inherit;cursor:pointer}
video{display:block}
.w{max-width:1280px;margin:0 auto;padding-left:40px;padding-right:40px;box-sizing:border-box}
.sec{padding-top:72px;padding-bottom:104px}
.hd{font-family:'Shadows Into Light',cursive;line-height:1.15}
.logo{font-size:34px}.hs{font-size:20px}.hm{font-size:24px}.hl{font-size:32px}.hxl{font-size:44px}
.h1{font-size:clamp(40px,7vw,100px);line-height:0.96;font-weight:500;letter-spacing:-0.045em}
.nav{display:flex;flex-wrap:wrap;gap:28px;font-size:14px;letter-spacing:0.06em;text-transform:uppercase}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px}
.mail{font-size:clamp(22px,5.5vw,80px);overflow-wrap:anywhere}
.show{padding-top:56px;scroll-margin-top:20px}
.toggle{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border-radius:999px;background:transparent;color:#F3EBDD;border:1px solid #4A4038;font-size:13px;letter-spacing:0.08em;text-transform:uppercase}
.toggle:hover{border-color:#F5C842;color:#F5C842}
.toggle .ar{display:inline-block;font-size:16px;transition:transform .2s}
.toggle[aria-expanded="true"] .ar{transform:rotate(180deg)}
.reels{margin-top:24px}
.subs{margin-top:28px;padding-left:24px;border-left:2px solid #3A302A;display:flex;flex-direction:column;gap:36px}
@media (max-width:760px){.subs{padding-left:14px;gap:28px}}
.reel{margin:0;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#211B16}
.reel video{width:100%;height:100%;object-fit:cover;background:#000}
.show{border-bottom:1px solid #3A302A;padding-bottom:40px}
@media (max-width:760px){
.w{padding-left:20px;padding-right:20px}
.sec{padding-top:40px;padding-bottom:64px}
.logo{font-size:30px}.hs{font-size:17px}.hm{font-size:20px}.hl{font-size:26px}.hxl{font-size:32px}
.nav{gap:6px 16px;font-size:12px}
.filters{flex-wrap:nowrap;overflow-x:auto;margin-left:-20px;margin-right:-20px;padding:0 20px 6px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}
.show{padding-top:40px}
.show>div:first-child,.sub>div:first-child{flex-direction:column;align-items:flex-start!important;gap:4px!important}
}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="background: #17130F; color: #F3EBDD; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 16px; line-height: 1.6; overflow-x: hidden">

<header class="w" style="padding-top: 20px; padding-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center">
<a href="index.html" class="hd logo" style="color: #F5C842; text-decoration: none; line-height: 1">@leogiorno</a>
<nav aria-label="Main" class="nav">
<a href="index.html" style="text-decoration: none">← Reels</a>
<a href="#work" style="text-decoration: none; color: #F5C842">Brand work</a>
<a href="#contact" style="text-decoration: none">Contact</a>
</nav>
</header>

<section class="w sec" style="padding-bottom: 48px">
<p class="hd hl" style="margin: 0; color: #F5C842">another chapter</p>
<h1 class="h1" style="margin: 4px 0 0; max-width: 960px">Brand &amp; social work</h1>
<p style="margin: 20px 0 0; max-width: 620px; color: #B9AC9C; font-size: 18px">Content made for brand channels: live coverage of shows and events, edits built on trends, and formats with talent.</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px 40px; margin-top: 36px; padding-top: 24px; border-top: 1px solid #3A302A">
<div style="flex: 1 1 180px"><p style="margin: 0; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B9AC9C">Role</p><p style="margin: 4px 0 0; font-size: 17px">Social Media Specialist</p></div>
<div style="flex: 1 1 180px"><p style="margin: 0; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B9AC9C">Field</p><p style="margin: 4px 0 0; font-size: 17px">Entertainment</p></div>
<div style="flex: 1 1 180px"><p style="margin: 0; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B9AC9C">Formats</p><p style="margin: 4px 0 0; font-size: 17px">Reels, trends, live coverage</p></div>
</div>
</section>

<section id="work" class="w" style="padding-bottom: 96px">
<nav aria-label="Shows" class="filters" style="margin-bottom: 8px">
<sc-for list="{{ groups }}" as="g">
<a href="{{ g.href }}" class="hd hm" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; line-height: 1; white-space: nowrap; text-decoration: none; color: #F3EBDD; border: 1px solid #4A4038">{{ g.name }}</a>
</sc-for>
</nav>
<sc-for list="{{ groups }}" as="g">
<div id="{{ g.id }}" class="show">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 18px">
<h2 style="margin: 0; font-size: clamp(28px, 4vw, 44px); font-weight: 500; letter-spacing: -0.03em; line-height: 1">{{ g.name }}</h2>
<p class="hd hm" style="margin: 0; color: #F5C842">{{ g.note }}</p>
</div>
<button type="button" class="toggle" onClick="{{ g.toggle }}" aria-expanded="{{ g.open }}"><span>{{ g.label }}</span><span class="ar" aria-hidden="true">↓</span></button>
<sc-if value="{{ g.showReels }}">
<div class="grid reels">
<sc-for list="{{ g.items }}" as="p">
<figure class="reel">
<video src="{{ p.src }}" poster="{{ p.poster }}" controls="" playsinline="" preload="none" onPlay="{{ solo }}"></video>
</figure>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ g.showSubs }}">
<div class="subs">
<sc-for list="{{ g.subs }}" as="s">
<div class="sub">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 14px">
<h3 style="margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 500; letter-spacing: -0.02em; line-height: 1.05">{{ s.name }}</h3>
<p class="hd hs" style="margin: 0; color: #F5C842">{{ s.note }}</p>
</div>
<button type="button" class="toggle" onClick="{{ s.toggle }}" aria-expanded="{{ s.open }}"><span>{{ s.label }}</span><span class="ar" aria-hidden="true">↓</span></button>
<sc-if value="{{ s.isOpen }}">
<div class="grid reels">
<sc-for list="{{ s.items }}" as="p">
<figure class="reel">
<video src="{{ p.src }}" poster="{{ p.poster }}" controls="" playsinline="" preload="none" onPlay="{{ solo }}"></video>
</figure>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</section>

<footer id="contact" style="background: #F5C842; color: #17130F">
<div class="w" style="padding-top: 80px; padding-bottom: 48px">
<p class="hd hxl" style="margin: 0">let’s work together</p>
<a href="mailto:giornoleonardo@gmail.com" class="mail" style="display: block; margin-top: 8px; color: #17130F; line-height: 1.05; font-weight: 500; letter-spacing: -0.04em; text-decoration: none">giornoleonardo@gmail.com</a>
<div style="display: flex; flex-wrap: wrap; gap: 16px 32px; margin-top: 48px; padding-top: 24px; border-top: 1px solid #17130F; font-size: 15px; font-weight: 500"><a href="https://www.instagram.com/leogiorno/" style="color: rgb(23, 19, 15)">Instagram</a><a href="https://www.linkedin.com/in/leonardo-giorno-124757246/" style="color: rgb(23, 19, 15)">LinkedIn</a></div>
</div>
</footer>

</div>
</template>
